id = "ci"
name = "CI"
runtime_api = 2

# CI works against genuine project instances: Buildkite/PR resolution and the
# shared `pr` rows are project/repository behavior, not folder-workspace data.
requirements = ["project", "repository"]

# JJ: one CI item per open PR matched by repo + local bookmark within
# reachable(@, mutable()), the same connected stack used by the Stack panel.
# Shared pr rows provide identity and aggregate check status; Buildkite details
# are fetched independently for each open PR's head_ref. Closed and merged PRs
# have no CI item. The newest open PR wins if a bookmark has been reused.
# Unbookmarked changes have no PR item. Git instances keep their current-branch Buildkite view.
# Build cards omit the redundant standalone pipeline/repo heading.

[[panels]]
id = "ci"
entry = "Ci.tsx"
title = "CI"

[[rpc]]
name = "failed_job_excerpts"
description = "return focused excerpts for failed jobs at a workspace root; payload: {workspace_id, pipeline, build_number, max_tokens?}"

[[rpc]]
name = "artifact_preview"
description = "return a bounded tail of a text artifact using authenticated Buildkite access; payload: {workspace_id, pipeline, build_number, artifact_id, max_bytes?}"


[[rpc]]
name = "retry_failed_jobs"
description = "retry all failed jobs in a build at a workspace root; payload: {workspace_id, pipeline, build_number}"
