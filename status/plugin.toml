id = "status"
name = "Status"
worker = "Worker.ts"
runtime_api = 2

# Diff comments remain deliberately project-scoped: `diff_comment.instance`
# stores the genuine `<project>/<instance>` slug, while execution, file, and
# view targeting use the workspace ID. These requirements keep the plugin out
# of folder/scratch contexts where that data scope is unavailable.
requirements = ["project", "repository"]

[[panels]]
id = "status"
entry = "Status.tsx"
title = "Status"

[[views]]
id = "diff"
entry = "Diff.tsx"
title = "Diff"

[[commands]]
id = "show_diff"
title = "Status: Show diff"
rpc = "open_diff"
shortcut = "primary-r"

[[rpc]]
name = "open_diff"
description = "open a project diff — payload: {workspace_id, placement?: 'tab' | 'split-right' | 'split-down', command?: string[]}; command runs as argv at the workspace root and must emit a git-format patch"

[[rpc]]
name = "list_comments"
description = "list saved local diff comment threads for a genuine project instance, oldest first, including replies and line ranges — requires a project instance target (--workspace or --instance <project>/<instance>)"

[[rpc]]
name = "resolve_comment"
description = "mark a saved local diff comment resolved — requires a project instance target (--workspace or --instance <project>/<instance>); payload: {id}"

[[rpc]]
name = "reply_comment"
description = "reply to a saved local diff comment — requires a project instance target (--workspace or --instance <project>/<instance>); payload: {id, body}"

[[rpc]]
name = "refresh_diff"
description = "register a per-view refresh handler for diff arguments; payload: {command?: string[], vcs?: 'git' | 'jj'}; this build acknowledges view targets but does not implement general targeted RPC routing"
